name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve pinned server source
        id: ver
        run: |
          pnpm exec tsx -e '
            import { readServerPin } from "./scripts/server-pin.ts";
            const pin = readServerPin();
            console.log("version=" + pin.version + "\nref=" + pin.ref + "\nsource_pinned=" + pin.sourcePinned);
          ' >> "$GITHUB_OUTPUT"

      - name: Download omnigraph-server binary
        if: steps.ver.outputs.source_pinned == 'false'
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          asset="omnigraph-linux-x86_64.tar.gz"
          checksum="omnigraph-linux-x86_64.sha256"
          mkdir -p "$HOME/.local/bin"
          # Keep the original asset filename so the .sha256 manifest matches.
          curl -fsSL -o "/tmp/${asset}" \
            "https://github.com/ModernRelay/omnigraph/releases/download/v${v}/${asset}"
          curl -fsSL -o "/tmp/${checksum}" \
            "https://github.com/ModernRelay/omnigraph/releases/download/v${v}/${checksum}"
          (cd /tmp && sha256sum -c "${checksum}")
          tar -C "$HOME/.local/bin" -xzf "/tmp/${asset}"
          chmod +x "$HOME/.local/bin/omnigraph" "$HOME/.local/bin/omnigraph-server"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Until the server release exists, run the same e2e suite against the
      # exact source used by sync-spec, never a moving branch.
      - name: Check out immutable server candidate
        if: steps.ver.outputs.source_pinned == 'true'
        uses: actions/checkout@v4
        with:
          repository: ModernRelay/omnigraph
          ref: ${{ steps.ver.outputs.ref }}
          path: .server-source
          persist-credentials: false

      - name: Prepare server source build
        if: steps.ver.outputs.source_pinned == 'true'
        working-directory: .server-source
        env:
          SERVER_REF: ${{ steps.ver.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SERVER_REF"
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev
          rustup toolchain install

      - name: Cache server source build
        if: steps.ver.outputs.source_pinned == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .server-source -> target

      - name: Build pinned server candidate
        if: steps.ver.outputs.source_pinned == 'true'
        working-directory: .server-source
        run: |
          set -euo pipefail
          cargo build --locked -p omnigraph-cli --bin omnigraph \
            -p omnigraph-server --bin omnigraph-server
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - run: pnpm run build
      - name: Qualify SDK and MCP against the pinned server
        run: pnpm run test:e2e

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omnigraph-server-logs
          path: /tmp/omnigraph-sdk-e2e-*/server.log
